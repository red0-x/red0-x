name: snake

on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # first dot colour = empty day, then low -> high activity (red0xx v2 tokens)
          outputs: |
            dist/snake.svg?color_snake=#FAF7F2&color_dots=#6E0B0F,#B3141C,#E01E2C,#F26B74,#FFB000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
